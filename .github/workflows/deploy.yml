name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: Azure resource group
        required: true
        default: visualiza-rg
  push:
    tags:
      - 'tfb-*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${{ github.repository }}/visualiza-backend:${{ github.sha }}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.image }}

  deploy-infra:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ github.event.inputs.resourceGroup || 'visualiza-rg' }}
          template: infra/main.bicep
          parameters: >-
            backendImage=${{ needs.build-image.outputs.image }}
            postgresAdminPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }}
            jwtSecret=${{ secrets.JWT_SECRET }}
