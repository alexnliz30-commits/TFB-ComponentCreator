services:
  postgres:
    image: postgres:16-alpine
    container_name: visualiza-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB no definido en .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER no definido en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD no definido en .env}
    ports:
      - "5432:5432"
    volumes:
      - visualiza-pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: visualiza-backend
    working_dir: /src
    command: ["dotnet", "run", "--project", "src/Visualiza.Api/Visualiza.Api.csproj", "--urls", "http://0.0.0.0:5080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      # Con clave presente se usa la IA real; con la variable VACÍA el generador cae
      # al mock. Ojo con el tercer caso, que no es ninguno de los dos: una clave
      # presente pero inválida NO cae al mock —el repliegue mira si está vacía, no si
      # sirve— y cada petición falla contra el proveedor. Eso ya no revienta con un
      # 500: el asistente responde en el propio chat diciendo que hay que revisar
      # ANTHROPIC_API_KEY, y el constructor visual sigue funcionando sin IA.
      Anthropic__UseMock: "false"
      # El secreto de firma JWT no se versiona en appsettings.json. Aquí lleva un
      # valor de desarrollo para que `docker compose up` funcione recién clonado
      # (este stack arranca en ASPNETCORE_ENVIRONMENT=Development). Sin él,
      # JwtTokenService aborta: exige un secreto de 32 caracteres como mínimo.
      # En cualquier despliegue real hay que definir JWT_SECRET en .env.
      Jwt__Secret: ${JWT_SECRET:-dev-only-insecure-secret-32-chars-min}
      # Código MAESTRO del constructor (RF11): abre cualquier proyecto. Cada
      # proyecto tiene además el suyo, que el servidor acuña al crearlo. Mismo
      # criterio que el secreto de arriba: valor de desarrollo para que el stack
      # funcione recién clonado. Vacío significa maestra cerrada, no abierta.
      Designer__AccessCode: ${DESIGNER_ACCESS_CODE:-visualiza-dev}
      # Crear un proyecto no exige llave: de ahí sale la primera. En un despliegue
      # público hay que ponerlo a false, porque cada alta devuelve un token válido
      # y por tanto acceso a la cuota de la API de Claude.
      Designer__OpenProjectCreation: ${DESIGNER_OPEN_PROJECT_CREATION:-true}
    ports:
      - "5080:5080"
    volumes:
      - ./backend:/src
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: visualiza-frontend
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  visualiza-pgdata:
